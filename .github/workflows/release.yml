name: Cross-platform packages
on:
  workflow_dispatch:
  push:
    branches: [codex/cross-platform-release]
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux build/capture dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libgl1-mesa-dev libegl1-mesa-dev ffmpeg x11-xserver-utils x11-utils wmctrl xvfb openbox pulseaudio pulseaudio-utils
      - name: macOS FFmpeg and Rust targets
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked -- --skip independent_audio_tracks_retain_distinct_signals
      - name: Native release build
        if: runner.os != 'macOS'
        run: cargo build --release --locked
      - name: Universal macOS release build
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
      - name: Retain macOS binaries for packaging diagnostics
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-binaries
          path: |
            target/x86_64-apple-darwin/release/potato-recorder
            target/x86_64-apple-darwin/release/potato-recorder-cli
            target/aarch64-apple-darwin/release/potato-recorder
            target/aarch64-apple-darwin/release/potato-recorder-cli
      - name: Actual X11 + PulseAudio recording smoke test
        if: runner.os == 'Linux'
        env:
          DISPLAY: ':99'
          XDG_SESSION_TYPE: x11
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /tmp/potato-xvfb.log 2>&1 &
          sleep 2
          openbox > /tmp/potato-openbox.log 2>&1 &
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=potato_test
          pactl set-default-sink potato_test
          target/release/potato-recorder-cli --self-test test-output/linux-smoke --audio --pause --rate 30000/1001
          ffmpeg -v error -i test-output/linux-smoke/*.mkv -map 0 -f null -
          set +e
          timeout 8s target/release/potato-recorder --ui-test en > test-output/linux-ui.log 2>&1
          result=$?
          set -e
          cat test-output/linux-ui.log
          test "$result" = 124
      - name: Package Windows with notices
        if: runner.os == 'Windows'
        run: ./scripts/package.ps1
      - name: Package Debian/archive
        if: runner.os == 'Linux'
        run: python3 scripts/package_unix.py linux
      - name: Package universal app/DMG
        if: runner.os == 'macOS'
        run: python3 scripts/package_unix.py macos
      - uses: actions/upload-artifact@v4
        with:
          name: potatorec-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.deb
            dist/*.tar.gz
            dist/*.dmg
            dist/*.sha256
