[package]
name = "potato-recorder"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "potato-recorder"

[[bin]]
name = "potato-recorder"
path = "src/main.rs"

[[bin]]
name = "potato-recorder-cli"
path = "src/cli.rs"

[dependencies]
potato-core = { path = "../crates/potato-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
crossbeam-channel = "0.5"
rayon = "1"
nnnoiseless = { version = "0.5", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Devices_FunctionDiscovery", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Globalization"] }
